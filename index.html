<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spider-NaN</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 8px; left: 10px; z-index: 10;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8e2ec; text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      #hud .bad { color: #ff6b6b; }
      /* --- score HUD (score-builder) --------------------------------------
         Same family as #hud: #0b0e13 ground, #d8e2ec text, ui-monospace, no
         external fonts or images. pointer-events:none everywhere so it can
         never eat the click that acquires pointer lock. */
      #score-hud {
        position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
        z-index: 10; pointer-events: none; text-align: center;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8e2ec; text-shadow: 0 2px 4px #000, 0 0 12px rgba(0,0,0,.6);
      }
      #score-value {
        font-size: 46px; font-weight: 700; letter-spacing: 1px; color: #f4f7fb;
        font-variant-numeric: tabular-nums;
      }
      #score-mult {
        margin-top: 2px; font-size: 22px; font-weight: 700; letter-spacing: 2px;
        color: #ffb454; min-height: 24px;
      }
      #score-hud.is-hot #score-value { color: #fff3df; }
      #score-tricks { margin-top: 6px; display: grid; gap: 2px; }
      .score-trick, .score-bank {
        font-size: 13px; letter-spacing: 1px; color: #9fd7ff;
        animation: score-fade 1.7s linear forwards;
      }
      .score-trick.is-big { font-size: 16px; color: #ffe08a; }
      .score-bank { font-size: 18px; color: #8fa3b6; animation-duration: 2.2s; }
      .score-bank.is-record { color: #7dffa8; font-weight: 700; }
      @keyframes score-fade {
        0% { opacity: 0; transform: translateY(6px); }
        12% { opacity: 1; transform: translateY(0); }
        70% { opacity: 1; }
        100% { opacity: 0; }
      }
      #score-record {
        position: fixed; right: 12px; bottom: 10px; z-index: 10; pointer-events: none;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8fa3b6; letter-spacing: 1px; text-shadow: 0 1px 2px #000;
      }
      body.game-ui-active #score-hud,
      body.game-ui-active #score-record { display: none; }
      /* --- voice-line subtitles (feel-builder) --------------------------------
         Same family as #hud and #score-hud: #0b0e13 ground, #d8e2ec text,
         ui-monospace, text-shadow. pointer-events:none mandatory — the
         subtitle bar sits across the bottom of the viewport and would eat
         the click that acquires pointer lock otherwise. */
      #subtitles {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
        z-index: 10; pointer-events: none; text-align: center;
        max-width: 80vw; padding: 6px 16px;
        background: rgba(11, 14, 19, .78); border-radius: 4px;
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8e2ec; text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.5);
        display: none; white-space: pre-wrap;
      }
      body.game-ui-active #subtitles { display: none; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
        background: #fff; border-radius: 50%; opacity: .7; z-index: 10; pointer-events: none;
      }
      body.game-ui-active #crosshair { opacity: 0; }
      #game-ui {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        background: rgba(11, 14, 19, .72);
        color: #d8e2ec; font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0; pointer-events: auto;
      }
      #game-ui.is-hidden { display: none; pointer-events: none; }
      #game-ui .ui-panel {
        width: min(360px, calc(100vw - 36px)); padding: 22px;
        background: rgba(14, 20, 28, .92); border: 1px solid rgba(216, 226, 236, .28);
        box-shadow: 0 18px 54px rgba(0, 0, 0, .45);
      }
      #game-ui .ui-title {
        margin: 0 0 18px; font-size: 22px; font-weight: 700; color: #f4f7fb;
      }
      #game-ui .ui-actions { display: grid; gap: 10px; }
      #game-ui button {
        width: 100%; min-height: 42px; padding: 0 14px;
        border: 1px solid rgba(216, 226, 236, .34); border-radius: 4px;
        background: #151d27; color: #d8e2ec; font: inherit; text-align: left; cursor: pointer;
      }
      #game-ui button:hover, #game-ui button:focus-visible {
        background: #203144; border-color: #d8e2ec; outline: none;
      }
      /* Mode cards on the "Elegir modo" screen. Same vocabulary as the plain
         .ui-actions buttons above — just a title line plus a blurb line. */
      #game-ui button.ui-mode {
        display: grid; gap: 4px; min-height: 0; padding: 12px 14px; text-align: left;
      }
      #game-ui .ui-mode-title { font-size: 15px; font-weight: 700; color: #f4f7fb; }
      #game-ui .ui-mode-blurb { font-size: 12px; line-height: 1.4; color: #93a4b6; }
      #game-ui button.ui-mode:hover .ui-mode-blurb,
      #game-ui button.ui-mode:focus-visible .ui-mode-blurb { color: #c3d2e0; }
      #game-ui .ui-setting {
        display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 18px;
      }
      #game-ui .ui-setting strong { color: #f4f7fb; font-weight: 700; }
      #game-ui input[type="range"] {
        grid-column: 1 / -1; width: 100%; accent-color: #d8e2ec;
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="crosshair"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
