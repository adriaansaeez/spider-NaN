<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>.Spider-NaN</title>
    <style>
      /* Self-hosted house type, same casts as presentacion/: Technor carries the
         display/UI voice, Tabular carries real values. Zero external hosts. */
      @font-face { font-family: 'Technor'; src: url('assets/fonts/technor-400.woff2') format('woff2'); font-weight: 400; font-display: swap; font-style: normal; }
      @font-face { font-family: 'Technor'; src: url('assets/fonts/technor-500.woff2') format('woff2'); font-weight: 500; font-display: swap; font-style: normal; }
      @font-face { font-family: 'Technor'; src: url('assets/fonts/technor-700.woff2') format('woff2'); font-weight: 700; font-display: swap; font-style: normal; }
      @font-face { font-family: 'Tabular'; src: url('assets/fonts/tabular-400.woff2') format('woff2'); font-weight: 400; font-display: swap; font-style: normal; }
      @font-face { font-family: 'Tabular'; src: url('assets/fonts/tabular-500.woff2') format('woff2'); font-weight: 500; font-display: swap; font-style: normal; }
      @font-face { font-family: 'Tabular'; src: url('assets/fonts/tabular-700.woff2') format('woff2'); font-weight: 700; font-display: swap; font-style: normal; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 8px; left: 10px; z-index: 10;
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8e2ec; text-shadow: 0 1px 2px #000; pointer-events: none;
      }
      #hud .bad { color: #ff6b6b; }
      /* --- score HUD (score-builder) --------------------------------------
         Same family as #hud: #0b0e13 ground, #d8e2ec text, ui-monospace, no
         external fonts or images. pointer-events:none everywhere so it can
         never eat the click that acquires pointer lock. */
      #score-hud {
        position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
        z-index: 10; pointer-events: none; text-align: center;
        font: 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8e2ec; text-shadow: 0 2px 4px #000, 0 0 12px rgba(0,0,0,.6);
      }
      #score-value {
        font-size: 46px; font-weight: 700; letter-spacing: 1px; color: #f4f7fb;
        font-variant-numeric: tabular-nums;
      }
      #score-mult {
        margin-top: 2px; font-size: 22px; font-weight: 700; letter-spacing: 2px;
        color: #ffb454; min-height: 24px;
      }
      #score-hud.is-hot #score-value { color: #fff3df; }
      #score-tricks { margin-top: 6px; display: grid; gap: 2px; }
      .score-trick, .score-bank {
        font-size: 13px; letter-spacing: 1px; color: #9fd7ff;
        animation: score-fade 1.7s linear forwards;
      }
      .score-trick.is-big { font-size: 16px; color: #ffe08a; }
      .score-bank { font-size: 18px; color: #8fa3b6; animation-duration: 2.2s; }
      .score-bank.is-record { color: #7dffa8; font-weight: 700; }
      @keyframes score-fade {
        0% { opacity: 0; transform: translateY(6px); }
        12% { opacity: 1; transform: translateY(0); }
        70% { opacity: 1; }
        100% { opacity: 0; }
      }
      #score-record {
        position: fixed; right: 12px; bottom: 10px; z-index: 10; pointer-events: none;
        font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #8fa3b6; letter-spacing: 1px; text-shadow: 0 1px 2px #000;
      }
      body.game-ui-active #score-hud,
      body.game-ui-active #score-record { display: none; }
      /* The debug HUD must not expose the engine telemetry over the title and
         mode screens. It stays visible in-game and on pause, exactly as today.
         Game.ts owns #hud visibility through an inline style (hud.setVisible),
         so this needs !important to beat it; the selector is scoped to main +
         modes only, so play and pause are untouched. */
      body:has(#game-ui[data-mode="main"]) #hud,
      body:has(#game-ui[data-mode="modes"]) #hud { display: none !important; }
      /* --- voice-line subtitles (feel-builder) --------------------------------
         Same family as #hud and #score-hud: #0b0e13 ground, #d8e2ec text,
         ui-monospace, text-shadow. pointer-events:none mandatory — the
         subtitle bar sits across the bottom of the viewport and would eat
         the click that acquires pointer lock otherwise. */
      #subtitles {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
        z-index: 10; pointer-events: none; text-align: center;
        max-width: 80vw; padding: 6px 16px;
        background: rgba(11, 14, 19, .78); border-radius: 4px;
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #d8e2ec; text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.5);
        display: none; white-space: pre-wrap;
      }
      body.game-ui-active #subtitles { display: none; }
      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px 0 0 -2px;
        background: #fff; border-radius: 50%; opacity: .7; z-index: 10; pointer-events: none;
      }
      body.game-ui-active #crosshair { opacity: 0; }
      /* ── In-game menu / pause / settings ─────────────────────────────────
         The presentation system (Technor + Tabular + one red accent #cc2018,
         fine rules, no pills, no glow, no diffuse shadows) translated to the
         game's dark house. Menu copy is anchored to the BOTTOM-LEFT with a
         generous gutter from both edges; legibility comes from a DIRECTIONAL
         scrim that rises from the bottom-left corner and dissolves to
         transparent long before the opposite edges, so the 3D world stays
         visible. No veil over the whole screen, no boxed panel on the title
         / mode screens, no hard edge where the scrim fades. */
      #game-ui {
        position: fixed; inset: 0; z-index: 20;
        --ground: #0b0e13;
        --text: #d8e2ec;
        --bright: #f4f7fb;
        --muted: #93a4b6;
        --red: #cc2018;
        --blue: #14459e;
        --rule: rgba(216, 226, 236, .18);
        --rule-soft: rgba(216, 226, 236, .07);
        --surface: #10151c;
        --f-display: 'Technor', system-ui, -apple-system, sans-serif;
        --f-data: 'Tabular', ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--text);
        font-family: var(--f-display);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
        text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
        -webkit-font-smoothing: antialiased;
        pointer-events: auto;
        background: linear-gradient(to top right,
          rgba(11, 14, 19, .97) 0%,
          rgba(11, 14, 19, .9) 9%,
          rgba(11, 14, 19, .78) 19%,
          rgba(11, 14, 19, .56) 30%,
          rgba(11, 14, 19, .33) 41%,
          rgba(11, 14, 19, .16) 52%,
          rgba(11, 14, 19, .05) 62%,
          transparent 72%);
      }
      #game-ui.is-hidden { display: none; pointer-events: none; }
      #game-ui ::selection { background: var(--red); color: #fff; }
      #game-ui :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 1px; }

      /* Form controls do NOT inherit font-family from their parent — the UA
         stylesheet forces its own (Arial/Roboto). Every menu control must
         explicitly inherit so the whole menu speaks Technor, not two fights. */
      #game-ui button, #game-ui input, #game-ui select, #game-ui textarea,
      #game-ui optgroup, #game-ui option { font-family: inherit; }

      /* The bottom-left stage. Row items hang off a left edge, never the rim:
         gutter = clamp(28px, 4vw, 64px) from each near edge. */
      #game-ui .ui-stage {
        position: absolute; left: 0; bottom: 0;
        box-sizing: border-box;
        width: min(560px, 52vw);
        max-width: 100vw;
        display: flex; flex-direction: column; align-items: stretch;
        padding: clamp(24px, 3.6vh, 48px) clamp(28px, 4vw, 64px) clamp(32px, 5vh, 64px);
      }
      #game-ui .ui-stage > .ui-actions { margin-top: clamp(20px, 3.4vh, 34px); }

      /* Title = the screen's signature. Large display type, one hair: a blue
         lead dot, a white "Spider-", a red "NaN". Stays on one line — a broken
         accent is an accident, not a composition. */
      #game-ui .ui-title {
        margin: 0;
        font-weight: 700;
        font-size: clamp(46px, 7.4vw, 122px);
        line-height: .95;
        letter-spacing: -.042em;
        color: var(--bright);
        text-shadow: 0 2px 3px rgba(0, 0, 0, .5);
        white-space: nowrap;
      }
      #game-ui .ui-title-dot {
        display: inline-block;
        color: var(--blue);
      }
      #game-ui .ui-title-nan { color: var(--red); }

      /* Section title for modes / pause / settings. */
      #game-ui .ui-screen-head {
        margin: 0 0 clamp(14px, 2.2vh, 22px);
        font-weight: 600;
        font-size: clamp(23px, 2.5vw, 34px);
        letter-spacing: -.02em;
        line-height: 1.05;
        color: var(--bright);
      }

      /* The action list: rows spaced by type and rhythm, no decorative rules.
         Hover/focus is a clean tonal shift plus one red mark — no lift, no
         growing underline. */
      #game-ui .ui-actions {
        display: flex; flex-direction: column; align-items: stretch;
        gap: clamp(2px, .5vh, 6px);
      }
      #game-ui .ui-action,
      #game-ui .ui-mode {
        width: 100%;
        margin: 0;
        border: 0;
        background: none;
        color: var(--text);
        font-weight: 400;
        text-align: left;
        cursor: pointer;
        transition: color .16s ease-out;
      }
      #game-ui .ui-action { position: relative; display: flex; align-items: center; padding: clamp(12px, 1.8vh, 17px) 0; }
      #game-ui .ui-mode { display: flex; flex-direction: column; gap: 3px; padding: clamp(12px, 1.8vh, 17px) 0; }

      /* The hover/focus mark hangs in the GUTTER so it never pushes the label:
         title and items share ONE left axis (mark = 10px + 14px gap, gutter is
         always >= 24px). */
      #game-ui .ui-mark {
        position: absolute; left: -24px; top: 50%;
        width: 10px; height: 10px; margin-top: -5px;
        background: var(--red);
        opacity: 0;
        transition: opacity .14s ease-out;
      }
      #game-ui .ui-action:hover, #game-ui .ui-action:focus-visible,
      #game-ui .ui-mode:hover,  #game-ui .ui-mode:focus-visible { color: var(--bright); }
      #game-ui .ui-action:hover .ui-mark,  #game-ui .ui-action:focus-visible .ui-mark,
      #game-ui .ui-mode:hover  .ui-mark,   #game-ui .ui-mode:focus-visible  .ui-mark { opacity: 1; }

      #game-ui .ui-action-label {
        color: inherit;
        font-weight: 500;
        font-size: clamp(18px, 1.9vw, 25px);
        letter-spacing: -.01em;
      }
      #game-ui .ui-mode-head { position: relative; display: flex; align-items: center; }
      #game-ui .ui-mode-title { color: inherit; font-weight: 600; font-size: clamp(17px, 1.8vw, 23px); letter-spacing: -.012em; }
      #game-ui .ui-mode-blurb {
        color: var(--muted);
        font-weight: 400;
        font-size: clamp(13px, 1.25vw, 15px);
        line-height: 1.45;
        max-width: 44ch;
      }

      /* Settings keeps a readable container — a tonal sheet, not a heavy box. */
      #game-ui .ui-panel {
        box-sizing: border-box;
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 2px;
        box-shadow: inset 0 1px 0 rgba(216, 226, 236, .06);
        padding: clamp(20px, 3vh, 30px) clamp(26px, 3.2vh, 34px);
      }
      #game-ui .ui-panel .ui-screen-head { margin-bottom: 14px; }
      #game-ui .ui-panel .ui-actions { margin-top: clamp(16px, 2.2vh, 24px); }
      #game-ui .ui-fields { display: flex; flex-direction: column; gap: 4px; }
      #game-ui .ui-setting {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: baseline;
        column-gap: 18px;
        row-gap: 2px;
        padding: 9px 0 13px;
      }
      #game-ui .ui-setting-label { font-weight: 500; font-size: clamp(15px, 1.5vw, 17px); letter-spacing: -.005em; color: var(--text); }
      /* Figures are real data: Tabular, never the display face. */
      #game-ui .ui-setting-value { font-family: var(--f-data); font-weight: 500; font-size: 14px; letter-spacing: .01em; color: var(--bright); }
      #game-ui input[type="range"] {
        grid-column: 1 / -1;
        width: 100%;
        height: 30px;
        margin: 2px 0 0;
        background: transparent;
        /* Volume level is a value, not a state: a tonal fill (light on the
           dark surface). Red is reserved for focus / checked / active. */
        accent-color: var(--text);
        cursor: pointer;
      }
      #game-ui input[type="checkbox"] {
        justify-self: end;
        align-self: center;
        width: 18px; height: 18px;
        margin: 0;
        accent-color: var(--red);
        cursor: pointer;
      }
      #game-ui .ui-select-wrap { position: relative; display: inline-flex; align-self: center; }
      #game-ui select {
        appearance: none;
        -webkit-appearance: none;
        border: 1px solid var(--rule);
        border-radius: 0;
        background: var(--ground);
        color: var(--bright);
        font-family: var(--f-display);
        font-weight: 500;
        font-size: 14px;
        line-height: 1.2;
        padding: 7px 30px 7px 10px;
        min-width: 180px;
        cursor: pointer;
      }
      #game-ui .ui-select-arrow {
        position: absolute; right: 10px; top: 50%;
        width: 7px; height: 7px; margin-top: -4px;
        border-right: 1.5px solid var(--text);
        border-bottom: 1.5px solid var(--text);
        transform: rotate(45deg);
        box-sizing: border-box;
        pointer-events: none;
      }
      #game-ui .ui-hint {
        margin: 8px 0 4px;
        font-weight: 400;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>
    <div id="crosshair"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
