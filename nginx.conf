server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /game -> /game/ must keep the caller's host and port (Docker maps 8080:80),
  # so redirect relatively instead of rebuilding an absolute URL.
  absolute_redirect off;

  # ...and it must also keep any reverse-proxy prefix. nginx's own directory
  # redirect emits a root-relative '/game/', which drops the '/prefix' when the
  # site is mounted under one. A path-relative 'game/' resolves against the
  # request URI instead, so it lands on /game/ at the root and /prefix/game/
  # behind a proxy. The trailing slash matters: the build's asset URLs are
  # relative to the game document.
  location = /game {
    return 301 game/;
  }

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml model/gltf-binary;

  types {
    model/gltf-binary  glb;
    model/gltf+json    gltf;
  }
  include /etc/nginx/mime.types;

  # Hashed build output: immutable.
  location /game/assets/ {
    try_files $uri =404;
  }

  # Range requests for the .mov / .mp3 media are on by default.
  location / {
    try_files $uri $uri/ =404;
  }
}
